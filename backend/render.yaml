services:
  # Render configuration for RackPulse Backend
  - type: web
    name: rackpulse-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py --host 0.0.0.0 --port $PORT
    autoDeploy: false
    healthCheckPath: /api/v1/dashboard/summary
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11
      - key: PORT
        value: 8000