# AquaMind AI — Phase 2 microservices (SDD Section 4/9/22).
#
# Runs the five independently-scalable services from the architecture
# diagram as separate containers, all built from the same base image
# (../Dockerfile) and sharing one SQLite database file over a named volume
# for this local demo. For real concurrent multi-service writes, point
# DATABASE_URL at a real Postgres/CockroachDB instance instead (same
# schema, zero code changes — see phase1_standalone/app/database.py).
#
# Usage (from the repo root):
#   docker compose -f phase2_distributed/docker-compose.yml up --build
#
# Then:
#   Dashboard / Dashboard API : http://localhost:8000
#   Telemetry Service         : http://localhost:8001/api/v1/health
#   Digital Twin Service      : http://localhost:8002/api/v1/health
#   Water Model Service       : http://localhost:8003/api/v1/health
#   Agent Service             : http://localhost:8004/api/v1/health

version: "3.9"

x-common: &common
  build:
    context: ..
    dockerfile: Dockerfile
  environment:
    - DATABASE_URL=sqlite:////app/data/aquamind_phase2.db
    - BEDROCK_ENABLED=false
  volumes:
    - aquamind_data:/app/data

services:
  telemetry_service:
    <<: *common
    command: ["python", "-m", "phase2_distributed.services.telemetry_service.main"]
    ports: ["8001:8001"]
    environment:
      - DATABASE_URL=sqlite:////app/data/aquamind_phase2.db
      - SERVICE_PORT=8001

  digital_twin_service:
    <<: *common
    command: ["python", "-m", "phase2_distributed.services.digital_twin_service.main"]
    ports: ["8002:8002"]
    environment:
      - DATABASE_URL=sqlite:////app/data/aquamind_phase2.db
      - SERVICE_PORT=8002

  water_model_service:
    <<: *common
    command: ["python", "-m", "phase2_distributed.services.water_model_service.main"]
    ports: ["8003:8003"]
    environment:
      - DATABASE_URL=sqlite:////app/data/aquamind_phase2.db
      - SERVICE_PORT=8003

  agent_service:
    <<: *common
    command: ["python", "-m", "phase2_distributed.services.agent_service.main"]
    ports: ["8004:8004"]
    environment:
      - DATABASE_URL=sqlite:////app/data/aquamind_phase2.db
      - SERVICE_PORT=8004

  dashboard_api_service:
    <<: *common
    command: ["python", "-m", "phase2_distributed.services.dashboard_api_service.main"]
    ports: ["8000:8000"]
    environment:
      - DATABASE_URL=sqlite:////app/data/aquamind_phase2.db
      - SERVICE_PORT=8000

volumes:
  aquamind_data:
